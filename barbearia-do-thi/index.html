<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Barbearia do Thi — Montese e Passaré</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body id="inicio">
  <a class="skip" href="#principal">Ir para o conteúdo</a>
  <header class="wrap cabecalho">
    <a class="marca" href="#inicio">
      <img src="logo.svg" width="38" height="38" alt="">
      <span>Barbearia<br>do Thi</span>
    </a>
    <span class="cidade">Fortaleza, CE</span>
    <nav aria-label="Navegação">
      <a class="agendar" href="#contato">Agendar um corte <span aria-hidden="true">↓</span></a>
    </nav>
  </header>

  <main class="wrap" id="principal">
    <section class="abertura" aria-labelledby="titulo">
      <div class="letreiro">
        <p class="rotulo">Cabelo &amp; barba</p>
        <h1 id="titulo">O corte é <span>no Thi<span class="ponto">.</span></span></h1>
        <p class="bairros">Montese <span aria-hidden="true">/</span> Passaré</p>
      </div>
      <div class="dupla">
        <figure class="trabalho">
          <img class="photo" src="foto.jpg" width="1440" height="960" alt="Barbeiro concentrado fazendo um corte, em fotografia em preto e branco">
          <figcaption class="photo-note">Foto ilustrativa</figcaption>
        </figure>
        <section class="unidades" id="contato" aria-labelledby="unidades-titulo">
          <p class="rotulo">Agendamento</p>
          <h2 id="unidades-titulo">Escolha tua unidade.</h2>
          <div class="enderecos">
            <a href="https://wa.me/5585998256167" target="_blank" rel="noreferrer" aria-label="Agendar no Montese pelo WhatsApp">
              <span><strong>Montese</strong><small>Rua Frei Orlando</small></span>
              <span class="seta" aria-hidden="true">↗</span>
            </a>
            <a href="https://wa.me/5585996040076" target="_blank" rel="noreferrer" aria-label="Agendar no Passaré pelo WhatsApp">
              <span><strong>Passaré</strong><small>Rua Santa Rita das Causas Impossíveis</small></span>
              <span class="seta" aria-hidden="true">↗</span>
            </a>
          </div>
          <a class="rede" href="https://www.instagram.com/barbeariadothi/" target="_blank" rel="noreferrer">Ver no Instagram <span aria-hidden="true">↗</span></a>
        </section>
      </div>
    </section>
  </main>

  <footer class="wrap rodape">
    <span>Barbearia do Thi</span>
    <small>Prévia privada de site e marca</small>
  </footer>
</body>
</html>
